[package]
name = "falco"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "falco"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ironrdp = { version = "0.17.0", features = [
  "connector",
  "session",
  "graphics",
] }
